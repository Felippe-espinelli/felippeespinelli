# Site Configuration
title: "Dr. Felippe Espinelli"
name: "Dr. Felippe Espinelli"
description: "Translational Neuroscientist | Chief Research Officer | Speaker"
url: "https://yourusername.github.io" # Replace with your GitHub username

# Theme Configuration
remote_theme: "mmistakes/minimal-mistakes@4.28.0"
minimal_mistakes_skin: "air" # Skins: air, aqua, contrast, dark, dirt, neon, mint, plum, sunrise

# Layout Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: false
      sidebar:
        nav: false

# Plugins supported by GitHub Pages
plugins:
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
